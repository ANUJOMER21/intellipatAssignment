[versions]
agp = "9.4.1"
kotlin = "2.2.10"
ksp = "2.3.12"
composeBom = "2026.02.01"
coreKtx = "1.16.0"
activityCompose = "1.12.0"
lifecycle = "2.10.0"
navigationCompose = "2.9.6"
room = "2.8.5"
workManager = "2.11.0"
koin = "4.1.1"
retrofit = "3.0.0"
okhttp = "5.1.0"
serialization = "1.9.0"
coroutines = "1.10.2"
junit = "4.13.2"
turbine = "1.2.1"
junitVersion = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
